
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Show Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="logo">Show<span>Explorer</span></div>
        <p>Discover your next favourite TV show</p>
    </header>

    <main class="container">

        <section class="search-section">
            <h1>Explore TV Shows</h1>
            <p>Search thousands of TV shows and discover something new.</p>

            <form id="searchForm" class="search-form">
                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search for a show..."
                    autocomplete="off"
                    required
                >
                <button type="submit">Search</button>
            </form>

            <div class="filters">
                <select id="genreFilter">
                    <option value="">All Genres</option>
                    <option value="Drama">Drama</option>
                    <option value="Comedy">Comedy</option>
                    <option value="Action">Action</option>
                    <option value="Crime">Crime</option>
                    <option value="Adventure">Adventure</option>
                    <option value="Science-Fiction">Science-Fiction</option>
                    <option value="Thriller">Thriller</option>
                    <option value="Romance">Romance</option>
                    <option value="Fantasy">Fantasy</option>
                    <option value="Anime">Anime</option>
                </select>

                <input
                    type="number"
                    id="yearFilter"
                    placeholder="Year (e.g. 2020)"
                    min="1900"
                    max="2100"
                >

                <button type="button" id="clearBtn" class="clear-btn">
                    Clear Filters
                </button>
            </div>
        </section>

        <div id="status" class="status">
            Search for a TV show to get started.
        </div>

        <div id="resultCount" class="result-count"></div>

        <section id="showContainer" class="show-grid"></section>

    </main>

    <!-- Details Popup -->
    <div id="showModal" class="modal" hidden>
        <div class="modal-content" role="dialog" aria-modal="true"
             aria-labelledby="modalTitle">

            <button type="button" id="closeModal"
                    class="close-btn" aria-label="Close">&times;</button>

            <div id="modalBody"></div>

        </div>
    </div>

    <footer>
        <p>Show Explorer | Powered by TVmaze API</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
