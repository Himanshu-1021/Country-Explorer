
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <a href="#" class="logo">CINE<span>FINDER</span></a>
        <p>Discover your next favourite movie</p>
    </header>

    <main class="container">

        <section class="hero">
            <h1>Explore the World of Cinema</h1>
            <p>Search thousands of movies and discover something amazing.</p>
        </section>

        <section class="search-section">

            <form id="searchForm">

                <div class="search-box">
                    <input
                        type="text"
                        id="movieInput"
                        placeholder="Search movies..."
                        required
                    >
                    <button type="submit">Search</button>
                </div>

                <div class="filters">

                    <select id="typeFilter">
                        <option value="all">All Genres</option>
                        <option value="Drama">Drama</option>
                        <option value="Comedy">Comedy</option>
                        <option value="Action">Action</option>
                        <option value="Crime">Crime</option>
                        <option value="Adventure">Adventure</option>
                        <option value="Science-Fiction">Science Fiction</option>
                        <option value="Anime">Anime</option>
                        <option value="Thriller">Thriller</option>
                    </select>

                    <input
                        type="number"
                        id="yearFilter"
                        placeholder="Release year"
                        min="1888"
                        max="2100"
                    >

                    <button type="button" id="clearBtn">
                        Clear Filters
                    </button>

                </div>

            </form>

        </section>

        <section class="results-section">

            <div class="section-heading">
                <h2>Discover Titles</h2>
                <span id="resultCount"></span>
            </div>

            <p id="status"></p>

            <div id="movieContainer" class="movie-grid"></div>

            <button id="loadMoreBtn" class="load-more" hidden>
                Load More
            </button>

        </section>

    </main>

    <!-- Movie Details Modal -->

<div class="modal" id="movieModal" hidden>
    <div class="modal-content">
        <button id="closeModal">×</button>
        <div id="modalBody"></div>
    </div>
</div>

    <footer>
        <p>© 2026 CineFinder | Powered by OMDb API</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
